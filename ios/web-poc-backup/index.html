<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Bookings</title>
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  
  <!-- Apple Web App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.jpg">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent-blue: #007ff5;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 0;
    }

    /* Mobile Container Simulation */
    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      padding: 24px 20px 80px 20px;
      position: relative;
    }

    /* PWA Install Banner */
    .pwa-banner {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: none; /* Shown dynamically in app.js */
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      animation: fadeIn 0.4s ease-out;
    }

    .pwa-banner img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
    }

    .pwa-banner-text {
      flex: 1;
    }

    .pwa-banner-text h4 {
      font-size: 15px;
      font-weight: 600;
    }

    .pwa-banner-text p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pwa-btn {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 30px;
      margin-top: 20px;
    }

    .logo-img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Wallet Card */
    .wallet-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .wallet-info h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .wallet-info .credits {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 4px;
    }

    .wallet-badge {
      background-color: rgba(0, 127, 245, 0.15);
      color: var(--accent-blue);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Schedule Section */
    .schedule-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.2px;
    }

    .class-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Class Card */
    .class-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .class-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .class-type-badge {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .class-capacity {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .class-name {
      font-size: 20px;
      font-weight: 600;
      margin-top: 4px;
      letter-spacing: -0.3px;
    }

    .class-details {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .class-detail-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .class-detail-item svg {
      width: 14px;
      height: 14px;
      fill: var(--text-secondary);
    }

    .book-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-book {
      background-color: var(--accent-blue);
      color: white;
    }

    .btn-book:hover {
      background-color: #1a8dfb;
    }

    .btn-cancel {
      background-color: rgba(255, 59, 48, 0.1);
      color: var(--accent-red);
      border: 1px solid rgba(255, 59, 48, 0.2);
    }

    .btn-cancel:hover {
      background-color: rgba(255, 59, 48, 0.15);
    }

    /* Floating Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background-color: #2c2c2e;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- PWA Install Banner -->
    <div id="pwaBanner" class="pwa-banner">
      <img src="icon.jpg" alt="Nexo Logo">
      <div class="pwa-banner-text">
        <h4>Nexo App</h4>
        <p>Install on your home screen</p>
      </div>
      <button id="installBtn" class="pwa-btn">Install</button>
    </div>

    <!-- Header -->
    <header>
      <img src="icon.jpg" alt="Nexo Logo" class="logo-img">
      <h1>Nexo</h1>
      <div class="tagline">Your training community, unified.</div>
    </header>

    <!-- Wallet Card -->
    <div class="wallet-card">
      <div class="wallet-info">
        <h3>Membership Wallet</h3>
        <div id="creditsDisplay" class="credits">12 Credits</div>
      </div>
      <div class="wallet-badge">Active Plan</div>
    </div>

    <!-- Schedule Title -->
    <div class="schedule-title">Today's Classes</div>

    <!-- Classes List -->
    <div id="classList" class="class-list">
      <!-- Injected via JavaScript -->
    </div>

  </div>

  <!-- Booking Success/Cancel Toast -->
  <div id="toast" class="toast">
    <span id="toastIcon"></span>
    <span id="toastMsg">Success!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
